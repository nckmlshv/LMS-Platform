syntax = "proto3";

package reviews.events;

import "google/protobuf/timestamp.proto";

enum EventType {
  UNSPECIFIED = 0;
  CREATED = 1;
  UPDATED = 2;
  DELETED = 3;
}

message Event {

  string id = 1;
  ReviewEventType type = 2;
  google.protobuf.Timestamp created_at = 3;
  Review review = 4;
}

message Review {

  string id = 1;
  string user_id = 2;

  string text = 3;
  repeated string pics_urls = 4;

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
